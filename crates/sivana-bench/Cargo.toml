[package]
name = "sivana-bench"
version = "0.1.0"
edition = "2024"
description = "Sivana benchmark platform: degradation matrix, corpus generation, baseline runner and reports."

[[bin]]
name = "sivana-bench"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sivana-core = { path = "../sivana-core" }
sivana-audio = { path = "../sivana-audio" }
sivana-dsp = { path = "../sivana-dsp" }
sivana-legacy = { path = "../../legacy" }

[dev-dependencies]
criterion = { version = "0.5", features = [] }

[[bench]]
name = "fingerprint"
harness = false
