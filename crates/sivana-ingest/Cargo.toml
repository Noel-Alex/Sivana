[package]
name = "sivana-ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1.10"
sivana-core = { path = "../sivana-core" }
sivana-dsp = { path = "../sivana-dsp" }
sivana-audio = { path = "../sivana-audio", features = ["decode"] }
sivana-landmark = { path = "../sivana-landmark" }
sivana-match = { path = "../sivana-match" }
sivana-index = { path = "../sivana-index" }
sivana-wasm = { path = "../sivana-wasm" }

[dev-dependencies]
sivana-audio = { path = "../sivana-audio", features = ["decode"] }

[[bin]]
name = "sivana-ingest"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
