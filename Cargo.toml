[workspace]
resolver = "2"
members = [
    "legacy",
    "crates/sivana-core",
    "crates/sivana-audio",
    "crates/sivana-dsp",
    "crates/sivana-landmark",
    "crates/sivana-match",
    "crates/sivana-index",
    "crates/sivana-bench",
]

# Sivana — production-grade Rust audio recognition system.
#
# Layout (research/PLAN.md §31):
#   crates/sivana-core    shared fingerprint/version/config types
#   crates/sivana-dsp     streaming DSP primitives
#   crates/sivana-audio   deterministic audio IO + synthetic fixtures
#   crates/sivana-index   LMDB + .siv mmap index backends (Phase 3)
#   crates/sivana-bench   degradation generator + benchmark runner
#   legacy/               frozen prototype, the control implementation

[profile.release]
lto = "thin"
codegen-units = 1
