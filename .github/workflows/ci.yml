name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: WASM build check (Phase 4)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p sivana-wasm --target wasm32-unknown-unknown
      - name: Benchmark smoke (Phase 0 exit criteria)
        run: cargo run -p sivana-bench --release -- run --tracks 2 --seconds 8

  wasm-asset-sync:
    name: verify wasm assets in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify wasm assets in sync
        run: bash scripts/wasm-sync-check.sh
